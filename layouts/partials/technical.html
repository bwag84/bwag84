<!-- Technical Skills Section — Obsidian-style Graph View -->
<section id="technical" class="relative overflow-hidden bg-bg dark:bg-bg" data-animate>
  <style>
    /* Graph color scheme — adapts to light/dark mode */
    #technical {
      --tech-node: rgba(30, 64, 175, 0.45);
      --tech-node-hover: rgba(30, 64, 175, 0.85);
      --tech-cat: rgba(30, 64, 175, 0.55);
      --tech-cat-stroke: rgba(30, 64, 175, 0.35);
      --tech-link: rgba(30, 64, 175, 0.12);
      --tech-link-active: rgba(30, 64, 175, 0.45);
      --tech-label: rgba(30, 64, 175, 0.75);
      --tech-skill-label: rgba(30, 64, 175, 0.85);
    }
    .dark #technical {
      --tech-node: rgba(96, 165, 250, 0.35);
      --tech-node-hover: rgba(96, 165, 250, 0.9);
      --tech-cat: rgba(96, 165, 250, 0.45);
      --tech-cat-stroke: rgba(96, 165, 250, 0.3);
      --tech-link: rgba(96, 165, 250, 0.08);
      --tech-link-active: rgba(96, 165, 250, 0.5);
      --tech-label: rgba(226, 232, 240, 0.65);
      --tech-skill-label: rgba(226, 232, 240, 0.9);
    }
    #tech-graph-wrap { position: relative; overflow: hidden; }
    #tech-heading { transition: opacity .2s; }
  </style>

  <!-- Content -->
  <div class="relative z-10">
    {{ with .Site.GetPage "technical" }}
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-16 pb-2">
        <h2 id="tech-heading" class="text-3xl font-bold text-center mb-2 font-heading text-text-primary dark:text-text-primary" data-default="{{ .Title }}">{{ .Title }}</h2>
      </div>

      <!-- Full-width graph -->
      <div id="tech-graph-wrap">
        <svg id="tech-graph"></svg>
      </div>

      <!-- D3 v7 -->
      <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

      <script>
      (function () {
        /* ── helpers: read CSS vars ── */
        function cv(name) {
          return getComputedStyle(document.getElementById("technical")).getPropertyValue(name).trim();
        }
        function colors() {
          return {
            node:       cv("--tech-node"),
            nodeHover:  cv("--tech-node-hover"),
            cat:        cv("--tech-cat"),
            catStroke:  cv("--tech-cat-stroke"),
            link:       cv("--tech-link"),
            linkActive: cv("--tech-link-active"),
            label:      cv("--tech-label"),
            skillLabel: cv("--tech-skill-label")
          };
        }
        var C = colors();

        /* ── ambient drift constant ── */
        var AMBIENT_ALPHA = 0.012;

        /* ── data (injected by Hugo) ── */
        var raw = {{ .Params.technical_groups | jsonify | safeJS }};
        var nodes = [];
        var links = [];

        var center = { id: "__center__", type: "center", fx: 0, fy: 0 };
        nodes.push(center);

        raw.forEach(function (g, gi) {
          var catId = "cat-" + gi;
          nodes.push({ id: catId, label: g.title, type: "category", skillCount: g.skills.length });
          links.push({ source: "__center__", target: catId, strength: 0.03 });

          g.skills.forEach(function (s) {
            var skillId = catId + "-" + s;
            nodes.push({ id: skillId, label: s, type: "skill", parentLabel: g.title, parent: catId });
            links.push({ source: catId, target: skillId });
          });
        });

        /* assign drift parameters to each node */
        nodes.forEach(function (n) {
          if (n.type !== "center") {
            n._driftPhaseX = Math.random() * Math.PI * 2;
            n._driftPhaseY = Math.random() * Math.PI * 2;
            n._driftSpeed  = 0.15 + Math.random() * 0.25;
          }
        });

        /* ── sizing (full width) ── */
        var wrap = document.getElementById("tech-graph-wrap");
        function dims() {
          var w = wrap.clientWidth;
          var h = Math.max(500, Math.min(720, window.innerHeight * 0.65));
          return { w: w, h: h };
        }

        var d = dims();
        var svg = d3.select("#tech-graph")
          .attr("width", d.w)
          .attr("height", d.h)
          .attr("viewBox", [-d.w / 2, -d.h / 2, d.w, d.h]);

        /* ── glow filter ── */
        var defs = svg.append("defs");
        var filter = defs.append("filter").attr("id", "glow");
        filter.append("feGaussianBlur").attr("stdDeviation", "3").attr("result", "blur");
        var merge = filter.append("feMerge");
        merge.append("feMergeNode").attr("in", "blur");
        merge.append("feMergeNode").attr("in", "SourceGraphic");

        /* ── simulation ── */
        var simulation = d3.forceSimulation(nodes)
          .force("link", d3.forceLink(links).id(function (n) { return n.id; })
            .distance(function (l) {
              if (l.source.type === "center" || l.target.type === "center") return 140;
              return 55;
            })
            .strength(function (l) {
              if (l.source.type === "center" || l.target.type === "center") return 0.03;
              return 0.7;
            })
          )
          .force("charge", d3.forceManyBody().strength(function (n) {
            if (n.type === "center") return 0;
            return n.type === "category" ? -250 : -25;
          }))
          .force("collision", d3.forceCollide().radius(function (n) {
            return n.type === "category" ? 28 : 12;
          }))
          .force("x", d3.forceX(0).strength(0.035))
          .force("y", d3.forceY(0).strength(0.035))
          .alphaDecay(0.02);

        /* ── ambient drift force — gentle sinusoidal nudges ── */
        simulation.force("drift", function () {
          var t = Date.now() * 0.001;
          nodes.forEach(function (n) {
            if (n.type === "center" || n.fx != null) return;
            n.vx += Math.sin(t * n._driftSpeed + n._driftPhaseX) * 0.04;
            n.vy += Math.cos(t * n._driftSpeed + n._driftPhaseY) * 0.04;
          });
        });

        /* keep simulation alive at low alpha for continuous drift */
        simulation.alphaTarget(AMBIENT_ALPHA);

        /* ── draw links ── */
        var linkSel = svg.append("g")
          .selectAll("line")
          .data(links.filter(function (l) {
            return !(l.source === "__center__" || l.target === "__center__"
                  || (l.source.id && l.source.id === "__center__")
                  || (l.target.id && l.target.id === "__center__"));
          }))
          .join("line")
          .attr("stroke", C.link)
          .attr("stroke-width", 1);

        /* ── draw nodes ── */
        var nodeSel = svg.append("g")
          .selectAll("g")
          .data(nodes.filter(function (n) { return n.type !== "center"; }))
          .join("g")
          .attr("cursor", "pointer")
          .call(d3.drag()
            .on("start", dragStart)
            .on("drag", dragging)
            .on("end", dragEnd));

        /* circles — monochrome, 10% larger */
        nodeSel.append("circle")
          .attr("r", function (n) { return n.type === "category" ? 8.8 : 4.3; })
          .attr("fill", function (n) { return n.type === "category" ? C.cat : C.node; })
          .attr("stroke", function (n) { return n.type === "category" ? C.catStroke : "none"; })
          .attr("stroke-width", function (n) { return n.type === "category" ? 1.5 : 0; });

        /* category labels (always visible, subtle) */
        nodeSel.filter(function (n) { return n.type === "category"; })
          .append("text")
          .text(function (n) { return n.label; })
          .attr("text-anchor", "middle")
          .attr("dy", 22)
          .attr("fill", C.label)
          .attr("font-size", "10px")
          .attr("font-weight", "600")
          .attr("pointer-events", "none");

        /* skill labels (hidden by default, revealed on highlight) */
        nodeSel.filter(function (n) { return n.type === "skill"; })
          .append("text")
          .text(function (n) { return n.label; })
          .attr("class", "skill-label")
          .attr("text-anchor", "middle")
          .attr("dy", -9)
          .attr("fill", C.skillLabel)
          .attr("font-size", "9px")
          .attr("font-weight", "500")
          .attr("pointer-events", "none")
          .attr("opacity", 0);

        /* ── reactive heading ── */
        var heading = document.getElementById("tech-heading");
        var defaultTitle = heading.getAttribute("data-default");

        function setHeading(text) {
          if (heading.textContent === text) return;
          heading.style.opacity = "0";
          setTimeout(function () {
            heading.textContent = text;
            heading.style.opacity = "1";
          }, 150);
        }

        /* ── interaction ── */
        var locked = null;

        function highlight(d) {
          if (!d || d.type === "center") { reset(); return; }

          var connected = new Set();
          connected.add(d.id);
          links.forEach(function (l) {
            var sid = typeof l.source === "object" ? l.source.id : l.source;
            var tid = typeof l.target === "object" ? l.target.id : l.target;
            if (sid === d.id) connected.add(tid);
            if (tid === d.id) connected.add(sid);
          });

          /* If a skill is highlighted, also include sibling skills via parent */
          if (d.type === "skill" && d.parent) {
            links.forEach(function (l) {
              var sid = typeof l.source === "object" ? l.source.id : l.source;
              var tid = typeof l.target === "object" ? l.target.id : l.target;
              if (sid === d.parent) connected.add(tid);
              if (tid === d.parent) connected.add(sid);
            });
          }

          /* update heading to show category name */
          var catLabel = d.type === "category" ? d.label : d.parentLabel;
          if (catLabel) setHeading(catLabel);

          nodeSel.select("circle")
            .transition().duration(200)
            .attr("fill", function (n) {
              if (n.id === d.id) return C.nodeHover;
              return n.type === "category" ? C.cat : C.node;
            })
            .attr("fill-opacity", function (n) { return connected.has(n.id) ? 1 : 0.12; })
            .attr("stroke-opacity", function (n) { return n.id === d.id ? 1 : 0.15; })
            .attr("filter", function (n) { return n.id === d.id ? "url(#glow)" : "none"; });

          nodeSel.select("text:not(.skill-label)")
            .transition().duration(200)
            .attr("fill-opacity", function (n) { return connected.has(n.id) ? 1 : 0.12; });

          /* reveal skill labels for connected skill nodes */
          nodeSel.select(".skill-label")
            .transition().duration(250)
            .attr("opacity", function (n) { return connected.has(n.id) ? 1 : 0; });

          linkSel.transition().duration(200)
            .attr("stroke", function (l) {
              var sid = typeof l.source === "object" ? l.source.id : l.source;
              var tid = typeof l.target === "object" ? l.target.id : l.target;
              return (sid === d.id || tid === d.id) ? C.linkActive : C.link;
            })
            .attr("stroke-opacity", function (l) {
              var sid = typeof l.source === "object" ? l.source.id : l.source;
              var tid = typeof l.target === "object" ? l.target.id : l.target;
              return (sid === d.id || tid === d.id) ? 1 : 0.08;
            })
            .attr("stroke-width", function (l) {
              var sid = typeof l.source === "object" ? l.source.id : l.source;
              var tid = typeof l.target === "object" ? l.target.id : l.target;
              return (sid === d.id || tid === d.id) ? 1.5 : 1;
            });
        }

        function reset() {
          locked = null;
          nodeSel.select("circle")
            .transition().duration(300)
            .attr("fill", function (n) { return n.type === "category" ? C.cat : C.node; })
            .attr("fill-opacity", 1)
            .attr("stroke-opacity", function (n) { return n.type === "category" ? 1 : 0; })
            .attr("filter", "none");

          nodeSel.select("text:not(.skill-label)")
            .transition().duration(300)
            .attr("fill-opacity", 1);

          /* hide skill labels */
          nodeSel.select(".skill-label")
            .transition().duration(300)
            .attr("opacity", 0);

          linkSel.transition().duration(300)
            .attr("stroke", C.link)
            .attr("stroke-opacity", 1)
            .attr("stroke-width", 1);

          setHeading(defaultTitle);
        }

        /* hover */
        nodeSel.on("mouseenter", function (ev, d) {
          if (locked) return;
          highlight(d);
        }).on("mouseleave", function () {
          if (locked) return;
          reset();
        });

        /* click to lock / unlock */
        nodeSel.on("click", function (ev, d) {
          ev.stopPropagation();
          if (locked && locked.id === d.id) { reset(); return; }
          locked = d;
          highlight(d);
        });

        svg.on("click", function () { reset(); });

        /* ── drag ── */
        function dragStart(ev, d) {
          if (!ev.active) simulation.alphaTarget(0.3).restart();
          d.fx = d.x;
          d.fy = d.y;
        }
        function dragging(ev, d) {
          d.fx = ev.x;
          d.fy = ev.y;
        }
        function dragEnd(ev, d) {
          if (!ev.active) simulation.alphaTarget(AMBIENT_ALPHA);
          d.fx = null;
          d.fy = null;
        }

        /* ── tick ── */
        simulation.on("tick", function () {
          linkSel
            .attr("x1", function (l) { return l.source.x; })
            .attr("y1", function (l) { return l.source.y; })
            .attr("x2", function (l) { return l.target.x; })
            .attr("y2", function (l) { return l.target.y; });

          nodeSel.attr("transform", function (n) { return "translate(" + n.x + "," + n.y + ")"; });
        });

        /* ── pause drift when tab hidden ── */
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) {
            simulation.alphaTarget(0).stop();
          } else {
            simulation.alphaTarget(AMBIENT_ALPHA).restart();
          }
        });

        /* ── resize ── */
        var resizeTimer;
        window.addEventListener("resize", function () {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(function () {
            var nd = dims();
            svg.attr("width", nd.w).attr("height", nd.h)
               .attr("viewBox", [-nd.w / 2, -nd.h / 2, nd.w, nd.h]);
            simulation.alpha(0.3).restart();
          }, 200);
        });

        /* ── react to dark-mode toggle ── */
        var observer = new MutationObserver(function () {
          C = colors();
          nodeSel.select("circle")
            .attr("fill", function (n) { return n.type === "category" ? C.cat : C.node; })
            .attr("stroke", function (n) { return n.type === "category" ? C.catStroke : "none"; });
          nodeSel.select("text:not(.skill-label)").attr("fill", C.label);
          nodeSel.select(".skill-label").attr("fill", C.skillLabel);
          linkSel.attr("stroke", C.link);
        });
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
      })();
      </script>
    {{ end }}
  </div>
</section>
